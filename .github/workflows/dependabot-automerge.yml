name: Dependabot auto-merge

# Merges a Dependabot PR once the CI workflow has passed on its head commit.
# With .github/dependabot.yml set to open-pull-requests-limit: 0, Dependabot
# only opens security-update PRs here, so this merges security fixes only.
# Production still needs its "Release SDK updates" PR merged by a person.
#
# Triggered by Dependabot's own pull_request event: only those runs can read
# Dependabot secrets (workflow_run runs cannot). CI runs on the push to the
# Dependabot branch, so this job waits for that run on the PR's head commit.
#
# The merge uses DEPENDABOT_AUTOMERGE_TOKEN (a repo-level Dependabot secret).
# A merge with the default GITHUB_TOKEN would not trigger stlc-promote, so
# the fix would never reach the production repository.
on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions: {}

concurrency:
  group: dependabot-automerge-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  automerge:
    name: Merge green Dependabot PR
    runs-on: ubuntu-latest
    timeout-minutes: 30
    if: >-
      github.actor == 'dependabot[bot]' &&
      github.event.pull_request.user.login == 'dependabot[bot]'
    steps:
      - name: Wait for CI, then merge
        env:
          GH_TOKEN: ${{ secrets.DEPENDABOT_AUTOMERGE_TOKEN }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
          SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          if [ -z "${GH_TOKEN}" ]; then
            echo "::error::Dependabot secret DEPENDABOT_AUTOMERGE_TOKEN is not set; not merging."
            exit 1
          fi
          RESULT=""
          for _ in $(seq 1 100); do
            RESULT=$(gh api "repos/${REPO}/actions/workflows/ci.yml/runs?head_sha=${SHA}&event=push&per_page=1" \
              --jq '.workflow_runs[0] | "\(.status) \(.conclusion)"')
            case "${RESULT}" in
              "completed success") break ;;
              completed*)
                echo "::warning::CI on ${SHA} finished as '${RESULT}'; leaving PR #${PR} for review."
                exit 0
                ;;
            esac
            sleep 15
          done
          if [ "${RESULT}" != "completed success" ]; then
            echo "::error::Timed out waiting for CI on ${SHA}."
            exit 1
          fi
          gh pr merge "${PR}" --repo "${REPO}" --squash --match-head-commit "${SHA}"
          echo "Merged #${PR}."
